<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Reference source for the icon; the actual multi-size app.ico is generated by
       scripts/make-icon.py (PIL). Blue squircle tile + white whale (DeepSeek brand). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#609eff"/>
      <stop offset="100%" stop-color="#3874ea"/>
    </linearGradient>
  </defs>
  <rect x="14" y="14" width="228" height="228" rx="60" fill="url(#bg)"/>
  <g fill="#fff">
    <!-- tail flukes -->
    <polygon points="172,140 223,113 203,145"/>
    <polygon points="172,147 223,175 203,142"/>
    <!-- body -->
    <ellipse cx="120.5" cy="140" rx="71.5" ry="39"/>
    <!-- pectoral fin -->
    <polygon points="93,170 75,198 117,176"/>
    <!-- blowhole spout -->
    <circle cx="80" cy="94" r="10"/>
    <circle cx="69.5" cy="82" r="8.5"/>
    <circle cx="84.5" cy="79" r="8.5"/>
  </g>
  <!-- eye -->
  <circle cx="89.5" cy="133.5" r="14.5" fill="#3268e0"/>
</svg>
